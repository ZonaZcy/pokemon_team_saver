<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宝可梦队伍管理器</title>

    <!-- External libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Local styles -->
    <link rel="stylesheet" href="css/main.css">

    <!-- Local scripts -->
    <script src="js/utils.js"></script>
    <script src="js/teamManager.js"></script>
    <script src="js/showdownParser.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa fa-users"></i> 宝可梦队伍管理器</h1>
            <p style="margin: 10px 0 0 0; opacity: 0.9;">
                管理您的宝可梦对战队伍
                <span style="background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-left: 10px;">
                    <i class="fa fa-shield"></i> 数据仅保存在本地，不传输到服务器
                </span>
            </p>
        </header>

        <div class="teams-header">
            <div class="stats-overview">
                <div class="stat-card">
                    <div class="stat-value" id="totalTeams">0</div>
                    <div class="stat-label">总队伍数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPokemons">0</div>
                    <div class="stat-label">总宝可梦数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="formatsCount">0</div>
                    <div class="stat-label">使用的格式</div>
                </div>
            </div>

            <div class="teams-toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索队伍、宝可梦..." class="textbox">
                    <button onclick="app.searchTeams()" class="button"><i class="fa fa-search"></i> 搜索</button>
                </div>

                <div class="filter-box">
                    <select id="formatFilter" class="select">
                        <option value="">所有格式</option>
                        <option value="gen9vgc2025regj">Gen 9 VGC 2025 Reg J</option>
                        <option value="gen9vgc2025regi">Gen 9 VGC 2025 Reg I</option>
                        <option value="gen9vgc2024regg">Gen 9 VGC 2024 Reg G</option>
                        <option value="gen9vgc2024regf">Gen 9 VGC 2024 Reg F</option>
                        <option value="gen9doublesou">Gen 9 Doubles OU</option>
                    </select>
                </div>

                <div class="action-buttons">
                    <button onclick="app.showImportDialog()" class="button button-primary">
                        <i class="fa fa-upload"></i> 导入队伍
                    </button>
                    <button onclick="app.showCloudLibrary()" class="button button-cloud">
                        <i class="fa fa-cloud"></i> 云端队伍库
                    </button>
                    <button onclick="app.exportAllTeams()" class="button">
                        <i class="fa fa-download"></i> 备份所有队伍
                    </button>
                </div>
            </div>
        </div>

        <div class="teams-container" id="teamsContainer">
            <div class="loading">
                <i class="fa fa-spinner fa-spin" style="font-size: 32px;"></i>
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <!-- Import Dialog -->
    <div id="importDialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>导入队伍</h2>
                <button onclick="app.closeImportDialog()" class="close-button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>队伍名称</label>
                    <input type="text" id="importTeamName" class="textbox" placeholder="输入队伍名称">
                </div>

                <div class="form-group">
                    <label>格式</label>
                    <input type="text" id="importTeamFormat" class="textbox" list="formatList" placeholder="选择或输入格式名称">
                    <datalist id="formatList">
                        <!-- 将从 meta_names.json 动态加载 -->
                    </datalist>
                </div>

                <div class="form-group">
                    <label>Showdown 格式队伍</label>
                    <textarea id="importTeamText" class="textarea" rows="15" placeholder="粘贴 Pokemon Showdown 格式的队伍...

例如:
Rillaboom @ Assault Vest
Ability: Grassy Surge
Level: 50
Tera Type: Fire
EVs: 252 HP / 252 Atk / 4 SpD
Adamant Nature
- Fake Out
- Grassy Glide
- Wood Hammer
- U-turn"></textarea>
                </div>

                <div class="modal-footer">
                    <button onclick="app.closeImportDialog()" class="button">取消</button>
                    <button onclick="app.importTeam()" class="button button-primary">
                        <i class="fa fa-upload"></i> 导入
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cloud Library Dialog -->
    <div id="cloudLibraryDialog" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2><i class="fa fa-cloud"></i> 云端队伍库</h2>
                <button onclick="app.closeCloudLibrary()" class="close-button">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cloudTeamsContainer" class="loading">
                    <i class="fa fa-spinner fa-spin" style="font-size: 32px;"></i>
                    <p>加载云端队伍中...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="app.closeCloudLibrary()" class="button">关闭</button>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 30px 20px; color: #666;">
        <p style="margin-bottom: 10px;">
            <strong>宝可梦队伍管理器 - 静态版本</strong>
        </p>
        <div style="display: inline-block; background: #e8f5e9; padding: 12px 20px; border-radius: 8px; margin: 10px 0;">
            <p style="margin: 0; color: #2e7d32; font-size: 14px;">
                <i class="fa fa-shield" style="color: #4caf50;"></i>
                <strong>数据安全保证</strong><br>
                <span style="font-size: 13px;">
                    所有队伍数据仅存储在您的浏览器本地（localStorage）<br>
                    不会上传到任何服务器 | 不会收集任何个人信息 | 完全离线可用
                </span>
            </p>
        </div>
        <p style="font-size: 12px; margin-top: 15px; color: #999;">
            支持 Showdown 格式导入导出 | 建议定期备份重要队伍
        </p>
    </footer>
</body>
</html>
